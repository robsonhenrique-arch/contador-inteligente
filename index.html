
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contador Inteligente de Pessoas</title>

  <script type="module">
    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    window.iniciarDeteccao = async function () {
      const video = document.getElementById("camera");
      const canvas = document.getElementById("marcacoes");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");
      const botao = document.getElementById("iniciar");

      botao.disabled = true;
      status.textContent = "Carregando detector...";

      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const detector = await FaceDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
          },
          runningMode: "VIDEO",
          minDetectionConfidence: 0.6
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        let entradas = 0;
        let pessoaPresente = false;
        let ultimaDeteccao = 0;
        let ultimaEntrada = 0;

        const tempoAusencia = 1800;
        const intervaloMinimo = 2500;

        const atualizarTela = (rostos) => {
          document.getElementById("entradas").textContent = entradas;
          document.getElementById("rostos").textContent = rostos;
        };

        window.zerarContador = function () {
          entradas = 0;
          atualizarTela(0);
          status.textContent = "Contador zerado. Pronto para testar.";
        };

        status.textContent = "Detecção ativa. Aproxime-se da câmera.";

        let ultimoVideo = -1;

        function analisar() {
          if (
            video.readyState >= 2 &&
            video.currentTime !== ultimoVideo
          ) {
            ultimoVideo = video.currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const resultado = detector.detectForVideo(
              video,
              performance.now()
            );

            const rostos = resultado.detections || [];
            const agora = Date.now();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#00e5a8";
            ctx.fillStyle = "#00e5a8";
            ctx.font = "16px Arial";

            for (const rosto of rostos) {
              const b = rosto.boundingBox;
              ctx.strokeRect(
                b.originX, b.originY, b.width, b.height
              );
              ctx.fillText(
                "Rosto",
                b.originX,
                Math.max(18, b.originY - 6)
              );
            }

            if (rostos.length > 0) {
              ultimaDeteccao = agora;

              if (
                !pessoaPresente &&
                agora - ultimaEntrada >= intervaloMinimo
              ) {
                entradas++;
                ultimaEntrada = agora;
                pessoaPresente = true;
                status.textContent = "Entrada registrada!";
              }
            } else if (
              pessoaPresente &&
              agora - ultimaDeteccao >= tempoAusencia
            ) {
              pessoaPresente = false;
              status.textContent = "Pronto para a próxima entrada.";
            }

            atualizarTela(rostos.length);
          }

          requestAnimationFrame(analisar);
        }

        analisar();
      } catch (erro) {
        console.error(erro);
        status.textContent =
          "Erro ao iniciar. Verifique a internet e a permissão da câmera.";
        botao.disabled = false;
      }
    };
  </script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .quadro {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 12px;
      background: black;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .painel {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }

    .cartao {
      background: #243248;
      border-radius: 12px;
      padding: 16px;
      flex: 1;
    }

    .numero {
      display: block;
      font-size: 32px;
      font-weight: bold;
      color: #70e1c1;
      margin-top: 8px;
    }

    button {
      padding: 14px 18px;
      margin: 6px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    #status {
      color: #70e1c1;
      min-height: 24px;
    }
  </style>
</head>

<body>
  <h1>Contador Inteligente</h1>
  <p id="status">Pronto para iniciar</p>

  <div class="quadro">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="marcacoes"></canvas>
  </div>

  <div class="painel">
    <div class="cartao">
      Entradas
      <span class="numero" id="entradas">0</span>
    </div>
    <div class="cartao">
      Rostos detectados
      <span class="numero" id="rostos">0</span>
    </div>
  </div>

  <button id="iniciar" onclick="iniciarDeteccao()">
    Iniciar detecção
  </button>

  <button onclick="zerarContador()">
    Zerar contador
  </button>

  <p>Protótipo de contagem por detecção facial.</p>
</body>
</html>
